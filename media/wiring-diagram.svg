<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">Arduino Uno to MPU6500 I2C wiring</title><desc id="desc">Connect GND to GND, SDA to A4 and SCL to A5. Power must match breakout specifications.</desc><rect width="1100" height="600" rx="22" fill="#eff8fb"/><text x="550" y="65" font-size="34" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#193a52">Arduino Uno + MPU6500-compatible sensor</text><text x="550" y="105" font-size="19" font-family="Arial,sans-serif" text-anchor="middle" fill="#426477">I²C connection diagram • verify breakout power and logic voltage</text><rect x="75" y="155" width="350" height="320" rx="22" fill="#287da9" stroke="#155071" stroke-width="5"/><text x="250" y="215" fill="white" font-size="30" text-anchor="middle" font-weight="bold" font-family="Arial">ARDUINO UNO</text><rect x="675" y="155" width="350" height="320" rx="22" fill="#2d6ea5" stroke="#184c7e" stroke-width="5"/><text x="850" y="215" fill="white" font-size="30" text-anchor="middle" font-weight="bold" font-family="Arial">MPU SENSOR</text><g font-family="Arial" font-size="23" font-weight="bold"><text x="365" y="274" fill="white" text-anchor="end">GND</text><text x="365" y="337" fill="white" text-anchor="end">A4 (SDA)</text><text x="365" y="400" fill="white" text-anchor="end">A5 (SCL)</text><text x="730" y="274" fill="white">GND</text><text x="730" y="337" fill="white">SDA</text><text x="730" y="400" fill="white">SCL</text></g><g stroke-width="9" fill="none" stroke-linecap="round"><path d="M405 266 H695" stroke="#343d48"/><path d="M405 329 H695" stroke="#45c17e"/><path d="M405 392 H695" stroke="#e8bf43"/></g><g fill="#ffe2a4"><circle cx="405" cy="266" r="11"/><circle cx="695" cy="266" r="11"/><circle cx="405" cy="329" r="11"/><circle cx="695" cy="329" r="11"/><circle cx="405" cy="392" r="11"/><circle cx="695" cy="392" r="11"/></g><rect x="80" y="500" width="940" height="66" rx="13" fill="#fff0cc" stroke="#e8ba56" stroke-width="2"/><text x="550" y="526" font-size="20" font-family="Arial" text-anchor="middle" font-weight="bold" fill="#67461a">POWER: sensor VCC → compatible supply; never assume 5V I²C tolerance.</text><text x="550" y="552" font-size="18" font-family="Arial" text-anchor="middle" fill="#67461a">Check module specifications; use 3.3V and level shifting if required.</text></svg>