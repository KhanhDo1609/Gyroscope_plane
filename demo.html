<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Watch a 35-second SkyFlight gameplay demo and see the Arduino controller wiring.">
  <title>SkyFlight | Gameplay demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #101e2a;
      color: #f1f7fb;
    }
    body { margin: 0; }
    main { max-width: 960px; margin: auto; padding: 3rem 1.25rem; }
    h1 { font-size: clamp(2.25rem, 7vw, 4rem); line-height: 1; margin: 0; }
    h2 { margin-top: 0; }
    p { color: #bfd1dc; line-height: 1.55; }
    a { color: #b4e8ff; }
    .play {
      display: inline-block;
      padding: .65rem 1rem;
      background: #ffc35b;
      color: #102231;
      border-radius: .5rem;
      font-weight: 700;
      text-decoration: none;
    }
    .links { display: flex; align-items: center; flex-wrap: wrap; gap: 1rem; }
    section { margin-top: 2rem; }
    video, img { display: block; width: 100%; height: auto; border-radius: .75rem; }
    video { aspect-ratio: 16 / 9; background: #0c1822; }
    footer { margin-top: 2rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SkyFlight</h1>
      <p>Fly through glowing rings with your keyboard or an Arduino motion controller.</p>
      <nav class="links" aria-label="Game and video">
        <a class="play" href="./index.html">Play SkyFlight</a>
        <a href="./media/skyflight-demo.mp4" download>Download MP4</a>
      </nav>
    </header>

    <section aria-labelledby="recording">
      <h2 id="recording">Gameplay demo · 35 seconds</h2>
      <video controls playsinline preload="metadata" poster="./media/skyflight-gameplay.png">
        <source src="./media/skyflight-demo.mp4" type="video/mp4">
        <a href="./media/skyflight-demo.mp4">Open the MP4</a>
      </video>
    </section>

    <section aria-labelledby="screenshot">
      <h2 id="screenshot">Gameplay screenshot</h2>
      <a href="./media/skyflight-gameplay.png">
        <img src="./media/skyflight-gameplay.png" width="2048" height="1032" loading="lazy"
          alt="A yellow plane flies toward glowing rings above low-poly islands in SkyFlight.">
      </a>
    </section>

    <section aria-labelledby="wiring">
      <h2 id="wiring">Arduino controller wiring</h2>
      <a href="./media/wiring-screenshot.png">
        <img src="./media/wiring-screenshot.png" width="873" height="720" loading="lazy"
          alt="Arduino Uno connected to a breadboard-mounted motion sensor.">
      </a>
      <p><a href="./media/wiring-diagram.svg">View the labeled wiring diagram</a></p>
    </section>

    <footer>
      <a href="https://github.com/KhanhDo1609/Gyroscope_plane">Source code and Arduino setup</a>
    </footer>
  </main>
</body>
</html>
